name: Testes

on:
  push:
  pull_request:
  # Rodar sem commit (reconferir infra, por exemplo): botão "Run workflow" na
  # aba Actions ou `gh workflow run testes.yml` de dentro do repo. Sem isso, a
  # única forma de ver o CI responder é empurrar um commit — e um commit só
  # para disparar CI suja o histórico com um SHA que não muda nada.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Duas pernas: o modo de avaliação (1) e o modo do demo publicado (0).
      # Sem a perna 0 nada automático olha o modo somente leitura, e texto ou
      # comportamento desse modo envelhece sem ninguém perceber. As duas rodam
      # até o fim mesmo se uma falhar — a comparação entre elas é o dado.
      fail-fast: false
      matrix:
        modo: ["1", "0"]
    name: testes (SIMULACAO_AUTO_APROVAR=${{ matrix.modo }})
    env:
      # O mesmo valor vai para o servidor e para quem roda os testes: a suíte
      # lê a flag do próprio ambiente, não do processo que está servindo.
      SIMULACAO_AUTO_APROVAR: ${{ matrix.modo }}
      ADMIN_EMAILS: "dono@exemplo.jus.br"
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o hash do screencast
        # O .sha256 é a prova de que o vídeo commitado é o vídeo conferido:
        # sem este passo, regravar docs/demo-fluxo.mp4 e esquecer o hash passa
        # verde e o README aponta para um arquivo que não é o hashado.
        run: sha256sum -c docs/demo-fluxo.sha256
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Subir servidor (os testes batem na API via HTTP)
        run: |
          python3 app.py > /tmp/servidor.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/hierarquia -o /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/hierarquia -o /dev/null
      - name: Conferir as contagens declaradas
        # O número de casos aparece no README, na cartilha (HTML e PDF) e no
        # rótulo do medir-modos-testes.sh, e já divergiu duas vezes. Falha aqui
        # antes da suíte: número errado no documento não é problema que os testes
        # de comportamento resolvam.
        run: python3 scripts/conferir-contagens.py
      - name: Auditoria de integridade (falha rápido)
        # ~1 s e olha o dado (órfãos, nulos, árvore servida): se a base quebrou,
        # saber isso antes dos ~45 s da suíte inteira economiza uma volta.
        run: python3 -m unittest tests.test_integridade_dados -v
      - name: Rodar testes
        run: python3 -m unittest discover -s tests -t . -v
      - name: Log do servidor (só em falha)
        if: failure()
        run: cat /tmp/servidor.log || true

  fumaca:
    # O `test` acima prova a API e o HTML servido; ninguém ali aperta um botão.
    # Este job abre o /admin num Chromium de verdade e percorre o caminho do
    # admin: login, Reconfirmar, primeira linha da fila e o gráfico mensal.
    runs-on: ubuntu-latest
    name: fumaça do admin (navegador real)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/fumaca/package-lock.json
      - name: Instalar o Chromium (sem apt)
        # `--with-deps` chama apt-get para instalar bibliotecas de sistema. No
        # runner 26.04 o mirror do Ubuntu não resolve por DNS e o passo passa
        # ~9 min em timeout antes de desistir — o teste em si leva 8 s.
        # `--only-shell` baixa só o headless shell (é ele que roda em modo
        # headless) e não toca no apt: de ~10 min para ~20 s por push (medido: 10m35s -> 22s).
        run: |
          cd tests/fumaca
          npm ci
          npx playwright install --only-shell chromium
      - name: Rodar o teste de fumaça
        run: cd tests/fumaca && node smoke.mjs
      - name: Fumaça da fila (vazia e escopo parcial)
        # Dois estados que já quebraram na tela e que o smoke.mjs não visita:
        # fila vazia (botão que não fazia nada) e usuário de escopo parcial
        # (a fila é da base inteira; o `conferir` exige escopo do setor).
        run: cd tests/fumaca && node smoke-fila.mjs
      - name: Acessibilidade medida (nome, foco e contraste nos dois temas)
        # O smoke clica e prova que a tela funciona; este mede o que ninguém vê
        # no olho: nome acessível, anel de foco por Tab e contraste WCAG AA.
        run: cd tests/fumaca && node acessibilidade.mjs
      - name: Guardar a tela da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fumaca-evidencia
          path: |
            /tmp/dc2-fumaca-*/registro.png
            /tmp/dc2-a11y-*/acessibilidade.png
          if-no-files-found: ignore
