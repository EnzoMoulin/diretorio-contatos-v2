name: Testes

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Duas pernas: o modo de avaliação (1) e o modo do demo publicado (0).
      # Sem a perna 0 nada automático olha o modo somente leitura, e texto ou
      # comportamento desse modo envelhece sem ninguém perceber. As duas rodam
      # até o fim mesmo se uma falhar — a comparação entre elas é o dado.
      fail-fast: false
      matrix:
        modo: ["1", "0"]
    name: testes (SIMULACAO_AUTO_APROVAR=${{ matrix.modo }})
    env:
      # O mesmo valor vai para o servidor e para quem roda os testes: a suíte
      # lê a flag do próprio ambiente, não do processo que está servindo.
      SIMULACAO_AUTO_APROVAR: ${{ matrix.modo }}
      ADMIN_EMAILS: "dono@exemplo.jus.br"
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o hash do screencast
        # O .sha256 é a prova de que o vídeo commitado é o vídeo conferido:
        # sem este passo, regravar docs/demo-fluxo.mp4 e esquecer o hash passa
        # verde e o README aponta para um arquivo que não é o hashado.
        run: sha256sum -c docs/demo-fluxo.sha256
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Subir servidor (os testes batem na API via HTTP)
        run: |
          python3 app.py > /tmp/servidor.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/hierarquia -o /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/hierarquia -o /dev/null
      - name: Rodar testes
        run: python3 -m unittest discover -s tests -t . -v
      - name: Log do servidor (só em falha)
        if: failure()
        run: cat /tmp/servidor.log || true

  fumaca:
    # O `test` acima prova a API e o HTML servido; ninguém ali aperta um botão.
    # Este job abre o /admin num Chromium de verdade e percorre o caminho do
    # admin: login, Reconfirmar, primeira linha da fila e o gráfico mensal.
    runs-on: ubuntu-latest
    name: fumaça do admin (navegador real)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/fumaca/package-lock.json
      - name: Instalar Playwright e o Chromium
        run: |
          cd tests/fumaca
          npm ci
          # O apt do runner às vezes não resolve o mirror do Ubuntu. Isso é
          # falha de infraestrutura, não do teste — e um CI vermelho por causa
          # dela mente sobre o código. Tenta com as libs de sistema; se o apt
          # falhar, instala só o navegador e segue: se faltar biblioteca, o
          # teste de fumaça é quem acusa, com erro de verdade.
          npx playwright install --with-deps chromium \
            || npx playwright install chromium
      - name: Rodar o teste de fumaça
        run: cd tests/fumaca && node smoke.mjs
      - name: Guardar a tela da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fumaca-evidencia
          path: /tmp/dc2-fumaca-*/registro.png
          if-no-files-found: ignore
