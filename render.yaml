services:
  - type: web
    name: diretorio-contatos-v2
    runtime: python
    plan: free
    buildCommand: "echo ok"
    startCommand: "HOST=0.0.0.0 python3 app.py"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.15.2
      - key: INTRANET_ONLY
        value: 0
      - key: LOCAL_LOGIN
        value: 0
      - key: SIMULACAO_AUTO_APROVAR
        value: 0
      # E-mail Google que vira admin no primeiro login. Sem ela ninguém é admin.
      - key: ADMIN_EMAILS
        sync: false
      # URL pública: destrava os links dos e-mails e o redirect do OAuth.
      # Valor fixo porque o nome do serviço (e portanto a URL) é fixo.
      - key: APP_BASE_URL
        value: https://diretorio-contatos-v2.onrender.com
      # JSON do client OAuth tipo "web" — segredo, só no painel.
      # Sem ele não há login Google e o admin fica inacessível no demo.
      - key: GOOGLE_CLIENT_JSON
        sync: false
